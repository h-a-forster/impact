<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Review Impact Map</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="graph.bundle.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a id="backLink" class="back" href="#">← Back to GitHub</a>
      <strong class="brand">Impact Map</strong>
      <select id="prSelect" class="pr-picker" aria-label="Pull request"></select>
      <nav id="revPills" class="pills" aria-label="Commit"></nav>
      <button id="themeBtn" type="button" class="theme-btn" aria-label="Switch light or dark mode"></button>
    </header>

    <div id="notice" class="notice" hidden></div>

    <main class="layout">
      <section class="col-main">
        <div id="prView" class="stack">
        <div id="routeCard" class="card"></div>
        <div id="intentCard" class="card"></div>
        <div class="card" id="mapCard">
          <div class="card-head">
            <div class="head-left">
              <h2>Impact map</h2>
              <div class="tabs" id="scopeTabs" role="group" aria-label="Map scope">
                <button type="button" data-scope="pr">This PR</button>
                <button type="button" data-scope="full">Full map</button>
                <button type="button" data-scope="blast">Blast radius</button>
                <button type="button" data-scope="swarm">Monte Carlo swarm</button>
              </div>
            </div>
            <div class="tabs" id="levelTabs" role="group" aria-label="Map level">
              <button type="button" data-level="concept">Concepts</button>
              <button type="button" data-level="file">Files</button>
              <button type="button" data-level="function">Functions</button>
            </div>
            <button type="button" class="card-toggle" data-card="mapCard" aria-expanded="true">▾ Hide</button>
          </div>
          <div id="fullBar" hidden>
            <div id="fullHint" class="muted"></div>
            <div class="timeline">
              <button type="button" id="fullPrev" aria-label="One step back" title="One step back">←</button>
              <button type="button" id="fullPlay">▶ Play</button>
              <button type="button" id="fullNext" aria-label="One step forward" title="One step forward">→</button>
              <div id="fullStep" class="timeline-label"></div>
            </div>
            <div id="fullDots" class="timeline-dots" aria-hidden="true"></div>
          </div>
          <div id="blastView" hidden></div>
          <div id="swarmView" hidden></div>
          <div id="graphWrap" class="graph-wrap"><div id="graphFlow"></div><div id="graphVis" hidden></div></div>
          <div id="mapFoot" class="map-foot"></div>
        </div>
        <div id="reviewCard" class="card"></div>
        <div id="decisionCard" class="card"></div>
        </div>
      </section>
      <aside class="col-side">
        <div id="sidePanel" class="card side"></div>
      </aside>
    </main>
    <button id="agentBtn" type="button" class="agent-fab" hidden>Ask the agent</button>
    <div id="agentChat" class="agent-chat" hidden></div>
    <!-- Functions level: vis-network, the library Graphify's own graph.html uses. -->
    <script src="vendor/vis-network/vis-network.min.js"></script>
    <!-- Concepts and Files levels: React Flow + Dagre. Built from src/graph/main.jsx by `npm run build:graph`. -->
    <script src="graph.bundle.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
